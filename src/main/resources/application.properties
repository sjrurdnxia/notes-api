spring.application.name=demo

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/demo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Creates/updates the "names" table automatically on startup
spring.jpa.hibernate.ddl-auto=update

# Secret used to sign login tokens (at least 32 characters).
# Set jwt.secret in secrets.properties, or the JWT_SECRET environment variable.
jwt.secret=${JWT_SECRET:}
jwt.expiry-minutes=60

# Claude model for note suggestions. claude-haiku-5-5 is faster and cheaper; claude-opus-5-5 is more capable.
anthropic.model=${ANTHROPIC_MODEL:claude-haiku-5-5}

# Loads local secrets (e.g. anthropic.api-key) from secrets.properties in the project root, if present
spring.config.import=optional:file:./secrets.properties
anthropic.api-key=${ANTHROPIC_API_KEY:}

# Encrypts tokens stored in the database. Set both in secrets.properties.
token-encryption.password=${TOKEN_ENCRYPTION_PASSWORD:}
token-encryption.salt=${TOKEN_ENCRYPTION_SALT:}

# Google sign-in. Set client id/secret in secrets.properties.
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/auth/google/callback}

# Include our error messages (e.g. "note not found") in error responses
spring.web.error.include-message=always
